doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        enable_native_lazy_objects: true
        entity_managers:
            default:
                auto_mapping: true
                mappings:
                    App:
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App
                    NowoLoginThrottleBundle:
                        type: attribute
                        is_bundle: true
                        dir: 'Entity'
                        prefix: 'Nowo\LoginThrottleBundle\Entity'
                        alias: NowoLoginThrottleBundle
