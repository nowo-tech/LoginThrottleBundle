services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\LoginThrottleBundle\:
    resource: '../../'
    exclude:
      - '../../DependencyInjection/'
      - '../../Event/'
      - '../../NowoLoginThrottleBundle.php'
      - '../../Throttle/'
      - '../../Repository/LoginAttemptView.php'

  # REQ-SF-003: #[AsCommand] + autoconfigure register the commands (no manual console.command tag).
  Nowo\LoginThrottleBundle\Command\ConfigureSecurityCommand:
    arguments:
      $projectDir: '%kernel.project_dir%'

  # nowo_login_throttle.attempt_store: the store resolved by AttemptStorePass (3.14) — the host's
  # LoginAttemptStoreInterface, else the host's deprecated LoginAttemptRepositoryInterface, else the bundle repository.
  Nowo\LoginThrottleBundle\Command\CleanupLoginAttemptsCommand:
    arguments:
      $repository: '@?nowo_login_throttle.attempt_store'
      $defaultWatchPeriod: '%nowo_login_throttle.watch_period%'

  # REQ-ORM-002: removed by the extension when nowo_login_throttle.doctrine.table_prefix is empty.
  Nowo\LoginThrottleBundle\Doctrine\TablePrefixListener:
    arguments:
      $tablePrefix: '%nowo_login_throttle.doctrine.table_prefix%'
    tags:
      - { name: doctrine.event_listener, event: loadClassMetadata }

  # REQ-SEC-006 (3.11.0): byte-exact NO PAD collation on username / ip_address (MySQL / MariaDB); removed by the
  # extension when the mapping is disabled.
  Nowo\LoginThrottleBundle\Doctrine\ExactCollationListener:
    arguments:
      $doctrine: '@doctrine'
      $logger: '@?logger'
    tags:
      - { name: doctrine.event_listener, event: postGenerateSchemaTable }

  # Repository for LoginAttempt entity (optional, only if Doctrine is installed)
  Nowo\LoginThrottleBundle\Repository\LoginAttemptRepository:
    arguments:
      $registry: '@doctrine'

  # Entity-free store port (3.14); alias it to your own store. The deprecated interface below keeps working.
  Nowo\LoginThrottleBundle\Repository\LoginAttemptStoreInterface: '@Nowo\LoginThrottleBundle\Repository\LoginAttemptRepository'

  Nowo\LoginThrottleBundle\Repository\LoginAttemptRepositoryInterface: '@Nowo\LoginThrottleBundle\Repository\LoginAttemptRepository'

  # Host code that gets the factory from the container receives the username_from_passport option (KF-L-I4);
  # the limits are still yours to bind.
  Nowo\LoginThrottleBundle\RateLimiter\DatabaseRateLimiterFactory:
    arguments:
      $repository: '@nowo_login_throttle.attempt_store'
      $usernameFromPassport: '%nowo_login_throttle.username_from_passport%'
      $eventDispatcher: '@?event_dispatcher'

  # Database rate limiter (registered conditionally in Extension when storage=database)
  # This service is registered dynamically in NowoLoginThrottleExtension::registerDatabaseRateLimiter()
  # It implements RequestRateLimiterInterface and can be used as a limiter in security.yaml

  # Login throttle info service (for displaying attempt information)
  Nowo\LoginThrottleBundle\Service\LoginThrottleInfoService:
    calls:
      - method: setFirewallsConfig
        arguments: ['%nowo_login_throttle.firewalls%']
      # optional - only needed for database storage
      - method: setRepository
        arguments: ['@?nowo_login_throttle.attempt_store']


  # HTTP-free status with the limiter's own rules (3.9)
  Nowo\LoginThrottleBundle\Service\LoginThrottleStatusProvider:
    arguments:
      $firewalls: '%nowo_login_throttle.firewalls%'
      $repository: '@?nowo_login_throttle.attempt_store'

  Nowo\LoginThrottleBundle\Service\LoginThrottleStatusProviderInterface:
    alias: Nowo\LoginThrottleBundle\Service\LoginThrottleStatusProvider
